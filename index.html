<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Happy Birthday</title>
<meta name="description" content="A story, for her." />

<!-- Fonts: Fraunces (display) + Public Sans (body) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500;1,9..144,600&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<!-- Signature scroll element -->
<div class="sunlight-ribbon"><div class="sunlight-ribbon__fill" id="ribbonFill"></div></div>

<!-- ================= BIRTHDAY ENVELOPE OVERLAY ================= -->
<div class="birthday-overlay" id="birthdayOverlay" role="dialog" aria-modal="true" aria-label="Birthday letter">
  <div class="birthday-overlay__inner">
    <div class="birthday-envelope" id="birthdayEnvelope">
      <div class="birthday-envelope__flap"></div>
      <div class="birthday-envelope__body">
        <div class="birthday-envelope__seal"></div>
      </div>
      <div class="birthday-envelope__letter" id="birthdayLetter">
        <div class="birthday-envelope__letter-inner">
          <p class="birthday-envelope__greeting">Happy Birthday,</p>
          <p class="birthday-envelope__greeting-name">Love ♡</p>
          <p class="birthday-envelope__message">A story, for you.</p>
          <button class="birthday-envelope__cta" id="birthdayCta">
            Begin Our Story <span aria-hidden="true">→</span>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ================= HERO ================= -->
<section class="hero" id="hero">
  <img class="hero__image" id="heroImage" src="" alt="" />
  <div class="hero__scrim"></div>
  <div class="hero__glow"></div>
  <div class="hero__content">
    <p class="eyebrow hero__eyebrow" id="heroEyebrow"></p>
    <h1 class="hero__title" id="heroTitle"></h1>
    <p class="hero__subtitle" id="heroSubtitle"></p>
    <button class="hero__cta" id="heroCta">
      <span id="heroCtaLabel"></span>
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M7 1v11M2 8l5 5 5-5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>
</section>

<!-- ================= BEFORE WE MET (Chapter One) ================= -->
<section class="section section--cream chapter-reveal chapter-reel" id="before-we-met">
  <div class="wrap">
    <div class="section__head reveal-stagger" data-delay="0">
      <p class="eyebrow chapter-reveal__eyebrow" id="beforeEyebrow"></p>
      <h2 class="section__heading chapter-reveal__title" id="beforeHeading"></h2>
      <p class="section__intro chapter-reveal__intro" id="beforeIntro"></p>
      <div class="music-slot chapter-reveal__music" id="musicSlot-before"></div>
    </div>
  </div>
  
  <!-- Horizontal Reel -->
  <div class="chapter-reel__wrapper" id="beforeReel" role="region" aria-label="Memory slideshow">
    <!-- Slides will be rendered by JavaScript -->
  </div>
  
  <!-- Navigation -->
  <div class="wrap">
    <div class="chapter-reel__nav" id="beforeReelNav" role="tablist" aria-label="Slide navigation">
      <!-- Dots will be rendered by JavaScript -->
    </div>
    <div class="chapter-reel__scroll-hint" aria-hidden="true">
      <span>Scroll to explore</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M7 13l5 5 5-5M7 6l5 5 5-5"/>
      </svg>
    </div>
  </div>
</section>

<!-- ================= THE CONVERSATIONS THAT STARTED IT (Chapter Two) ================= -->
<section class="section section--cream chapter-reveal" id="conversations">
  <div class="wrap">
    <div class="section__head reveal-stagger" data-delay="0">
      <p class="eyebrow chapter-reveal__eyebrow" id="conversationsEyebrow"></p>
      <h2 class="section__heading chapter-reveal__title" id="conversationsHeading"></h2>
      <p class="section__intro chapter-reveal__intro" id="conversationsIntro"></p>
      <div class="music-slot chapter-reveal__music" id="musicSlot-conversations"></div>
    </div>
    <div class="chat-phone chapter-reveal__phone" id="chatPhone">
      <div class="chat-phone__frame">
        <div class="chat-phone__header">
          <span class="chat-phone__avatar" aria-hidden="true">♡</span>
          <span class="chat-phone__name" id="chatContactName"></span>
        </div>
        <div class="chat-phone__screen">
          <p class="chat-date" id="chatDate"></p>
          <div class="chat-thread" id="chatThread"></div>
        </div>
      </div>
      <button class="chat-continue-btn" id="chatContinueBtn" type="button">
        <span id="chatContinueLabel"></span>
      </button>
    </div>
  </div>
</section>

<!-- ================= THE DAY WE MET (Chapter Three) ================= -->
<section class="section meet" id="day-we-met">
  <div class="wrap">
    <div class="meet__grid">
      <div class="meet__image-wrap reveal">
        <img id="meetImage" src="" alt="" />
      </div>
      <div class="reveal reveal-delay-1">
        <p class="eyebrow meet__eyebrow" id="meetEyebrow"></p>
        <div class="meet__meta" id="meetMeta"></div>
        <h2 class="meet__title" id="meetTitle"></h2>
        <p class="meet__caption" id="meetCaption"></p>
        <div class="music-slot" id="musicSlot-meet"></div>
      </div>
    </div>

    <div class="live-clock reveal" id="liveClock">
      <h3 class="live-clock__heading" id="liveClockHeading"></h3>
      <div class="live-clock__stats">
        <div class="live-clock__stat">
          <span class="live-clock__value" id="clockDays">0</span>
          <span class="live-clock__label" id="clockDaysLabel"></span>
        </div>
        <div class="live-clock__stat">
          <span class="live-clock__value" id="clockHours">00</span>
          <span class="live-clock__label" id="clockHoursLabel"></span>
        </div>
        <div class="live-clock__stat">
          <span class="live-clock__value" id="clockMinutes">00</span>
          <span class="live-clock__label" id="clockMinutesLabel"></span>
        </div>
        <div class="live-clock__stat">
          <span class="live-clock__value" id="clockSeconds">00</span>
          <span class="live-clock__label" id="clockSecondsLabel"></span>
        </div>
      </div>
      <p class="live-clock__subtitle" id="liveClockSubtitle"></p>
    </div>
  </div>
</section>

<!-- ================= FIRST MEMORIES (Chapter Four) ================= -->
<section class="section section--cream chapter-reveal" id="first-memories">
  <div class="wrap">
    <div class="section__head reveal-stagger" data-delay="0">
      <p class="eyebrow chapter-reveal__eyebrow" id="memoriesEyebrow"></p>
      <h2 class="section__heading chapter-reveal__title" id="memoriesHeading"></h2>
      <p class="section__intro chapter-reveal__intro" id="memoriesIntro"></p>
      <div class="music-slot chapter-reveal__music" id="musicSlot-memories"></div>
    </div>
    <div class="memories-grid" id="memoriesGrid">
      <!-- Cards will be rendered with staggered reveal classes -->
    </div>
  </div>
</section>

<!-- ================= THE LITTLE THINGS (Chapter Five) ================= -->
<section class="section section--cream" id="little-things">
  <div class="wrap">
    <div class="section__head reveal">
      <p class="eyebrow" id="littleEyebrow"></p>
      <h2 class="section__heading" id="littleHeading"></h2>
      <p class="section__intro" id="littleIntro"></p>
      <div class="music-slot" id="musicSlot-little"></div>
    </div>
    <div class="little-grid little-grid--icons" id="littleGrid"></div>
  </div>

  <div class="memory-modal" id="memoryModal" aria-hidden="true">
    <div class="memory-modal__backdrop" id="memoryModalBackdrop"></div>
    <div class="memory-modal__card" role="dialog" aria-modal="true" aria-labelledby="memoryModalCaption">
      <button class="memory-modal__close" id="memoryModalClose" type="button" aria-label="Close">×</button>
      <div class="memory-modal__frame">
        <img id="memoryModalImage" src="" alt="" />
      </div>
      <p class="memory-modal__caption" id="memoryModalCaption"></p>
    </div>
  </div>
</section>

<!-- ================= OUR JOURNEY (Chapter Six) ================= -->
<section class="section section--cream chapter-reveal" id="journey">
  <div class="wrap">
    <div class="section__head reveal-stagger" data-delay="0">
      <p class="eyebrow chapter-reveal__eyebrow" id="journeyEyebrow"></p>
      <h2 class="section__heading chapter-reveal__title" id="journeyHeading"></h2>
      <p class="section__intro chapter-reveal__intro" id="journeyIntro"></p>
      <div class="music-slot chapter-reveal__music" id="musicSlot-journey"></div>
    </div>
    <div class="timeline" id="timeline">
      <!-- Timeline items will be rendered with scroll-triggered animations -->
    </div>
  </div>
</section>

<!-- ================= FINAL MESSAGE (Chapter Seven) ================= -->
<section class="finale finale-reveal" id="finale">
  <img class="finale__image" id="finaleImage" src="" alt="" />
  <div class="finale__scrim"></div>
  <div class="finale__glow"></div>
  <div class="finale__content">
    <div class="finale-reveal__inner">
      <p class="eyebrow finale__eyebrow finale-reveal__eyebrow" id="finaleEyebrow"></p>
      <h2 class="finale__heading finale-reveal__heading" id="finaleHeading"></h2>
      <div class="finale__message-wrapper">
        <p class="finale__message finale-reveal__message" id="finaleMessage"></p>
      </div>
      <p class="finale__signature finale-reveal__signature" id="finaleSignature"></p>
      <p class="finale__foot finale-reveal__foot">Made with love, for you</p>
    </div>
  </div>
</section>

<script src="js/content.js"></script>
<script src="js/main.js"></script>
</body>
</html>
